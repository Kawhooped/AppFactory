<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuilderOS - From Idea to Shipped</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">⚙️ BuilderOS</div>
                <button id="newProjectBtn" class="btn-icon" title="New Project">+</button>
            </div>
            
            <div class="projects-list" id="projectsList"></div>
            
            <div class="sidebar-footer">
                <button id="exportBtn" class="btn-secondary">Export All</button>
                <button id="clearBtn" class="btn-secondary">Clear Data</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-state-content">
                    <div class="empty-icon">💡</div>
                    <h2>No Project Selected</h2>
                    <p>Create a new project to start building</p>
                    <button id="emptyNewBtn" class="btn-primary">Create Project</button>
                </div>
            </div>

            <!-- Project View -->
            <div id="projectView" class="project-view" style="display: none;">
                <div class="project-header">
                    <div class="project-title-section">
                        <h1 id="projectTitle" class="project-title"></h1>
                        <input id="projectTitleInput" class="project-title-input" style="display: none;" />
                        <button id="editTitleBtn" class="btn-icon">✏️</button>
                    </div>
                    <div class="project-actions">
                        <button id="deleteProjectBtn" class="btn-icon btn-danger">🗑️</button>
                    </div>
                </div>

                <div class="project-content">
                    <!-- Chat Workspace -->
                    <section class="chat-workspace">
                        <div class="workspace-header">
                            <h3>💬 Chat Workspace</h3>
                            <span class="messages-count" id="messagesCount">0</span>
                        </div>
                        <div class="messages-container" id="messagesContainer"></div>
                        <div class="chat-input-area">
                            <input 
                                id="chatInput" 
                                type="text" 
                                placeholder="Describe your ideas, features, or thoughts..."
                                class="chat-input"
                            />
                            <button id="sendBtn" class="btn-icon">→</button>
                        </div>
                    </section>

                    <!-- Structured Output -->
                    <section class="structured-output">
                        <div class="output-header">
                            <h3>📋 Structured Output</h3>
                            <button id="regenerateBtn" class="btn-secondary">Regenerate</button>
                        </div>
                        <div class="output-sections" id="outputSections">
                            <!-- Concept -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Concept</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="conceptSection">Empty</div>
                            </div>

                            <!-- Features -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Features</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="featuresSection">Empty</div>
                            </div>

                            <!-- Screens -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Screens</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="screensSection">Empty</div>
                            </div>

                            <!-- Data Model -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Data Model</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="dataModelSection">Empty</div>
                            </div>

                            <!-- Monetization -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Monetization</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="monetizationSection">Empty</div>
                            </div>

                            <!-- Tasks -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Tasks</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="tasksSection">Empty</div>
                            </div>

                            <!-- Next Steps -->
                            <div class="output-section">
                                <div class="section-header">
                                    <h4>Next Steps</h4>
                                    <button class="btn-collapse">−</button>
                                </div>
                                <div class="section-content" id="nextStepsSection">Empty</div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="storage.js"></script>
    <script src="compiler.js"></script>
    <script src="app.js"></script>
</body>
</html>
